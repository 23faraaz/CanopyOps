name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    name: Application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python syntax, Ruff lint and format, pytest
        run: python3 scripts/checks.py --only python
      - name: Hadolint, actionlint, quiet Compose validation
        run: python3 scripts/checks.py --only configuration
      - name: Build, cache, health, storage and runtime exclusions
        run: python3 scripts/checks.py --only container
      - name: Strict HIGH and CRITICAL vulnerability gate
        run: python3 scripts/checks.py --only scan
      - name: Verify scan workspace cleanup
        if: always()
        run: |
          python3 - <<'PY'
          import tempfile
          from pathlib import Path
          remaining = list(Path(tempfile.gettempdir()).glob("canopy-image-scan-*"))
          assert not remaining, "Scan temporary directories remain"
          print("Scan workspace cleanup verified")
          PY
  terraform:
    name: Terraform ${{ matrix.check }} (${{ matrix.root }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        root: [infra, infra/bootstrap, infra/registry]
        check: [format, validate, lint, security]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Terraform plugin download and offline lint
        if: matrix.check == 'lint'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/terraform_checks.py --root '${{ matrix.root }}' --only lint --github-token-from-env
      - name: Credential-free Terraform check
        if: matrix.check != 'lint'
        run: python3 scripts/terraform_checks.py --root '${{ matrix.root }}' --only '${{ matrix.check }}'
  checks:
    name: checks
    if: ${{ always() }}
    needs: [application, terraform]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require application and every Terraform matrix job
        run: |
          test '${{ needs.application.result }}' = success
          test '${{ needs.terraform.result }}' = success
