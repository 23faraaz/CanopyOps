name: Terraform plan
on:
  pull_request:
    paths: ['infra/**', '.github/workflows/terraform-*.yml', 'scripts/terraform_automation.py', 'scripts/deployment_inputs.py', 'scripts/plan_review.py', 'tests/test_plan_review.py', 'tests/test_deployment_inputs.py', 'scripts/cloud_plan_policy.py', 'scripts/cloud_teardown.py', 'tests/test_terraform_automation.py']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/terraform-*.yml', 'scripts/terraform_automation.py', 'scripts/deployment_inputs.py', 'scripts/plan_review.py', 'tests/test_plan_review.py', 'tests/test_deployment_inputs.py', 'scripts/cloud_plan_policy.py', 'scripts/cloud_teardown.py', 'tests/test_terraform_automation.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'terraform-demo-state' || format('terraform-unprivileged-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/terraform-static.yml
    with:
      roots: '["infra"]'
  plan:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.TERRAFORM_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: terraform-plan
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_TF_ROLE_ARN: ${{ vars.AWS_TF_ROLE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source and selected plan before requesting AWS credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/terraform_automation.py preflight
          --operation plan --commit '${{ github.sha }}'
          --run '${{ github.run_id }}' --attempt '${{ github.run_attempt }}'
          --account "$AWS_ACCOUNT_ID" --role "$AWS_TF_ROLE_ARN"
          --directory '${{ runner.temp }}/terraform-demo'
      - name: Require successful main CI for the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/wait_for_ci.py --repository 23faraaz/CanopyOps --commit '${{ github.sha }}'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TF_ROLE_ARN }}
          aws-region: eu-west-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 900
          unset-current-credentials: true
      - name: Execute the bounded demo operation
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/terraform_automation.py execute
          --operation plan --commit '${{ github.sha }}'
          --run '${{ github.run_id }}' --attempt '${{ github.run_attempt }}'
          --account "$AWS_ACCOUNT_ID" --role "$AWS_TF_ROLE_ARN"
          --directory '${{ runner.temp }}/terraform-demo'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-demo-apply-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/terraform-demo/artifact/metadata.json
          retention-days: 1
          if-no-files-found: error
