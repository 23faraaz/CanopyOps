name: Application publishing
on:
  pull_request:
    paths: ['app/**', 'docker/**', 'Dockerfile', '.dockerignore', 'pyproject.toml', 'tests/**', 'scripts/release_images.py', 'scripts/ecr_scan_gate.py', 'scripts/wait_for_ci.py', 'scripts/verify_cloud_runtime.py', 'scripts/checks.py', 'scripts/terraform_checks.py', 'scripts/recovery/**', '.github/workflows/application.yml']
  push:
    branches: [main]
    paths: ['app/**', 'docker/**', 'Dockerfile', '.dockerignore', 'pyproject.toml', 'tests/**', 'scripts/release_images.py', 'scripts/ecr_scan_gate.py', 'scripts/wait_for_ci.py', 'scripts/verify_cloud_runtime.py', 'scripts/checks.py', 'scripts/terraform_checks.py', 'scripts/recovery/**', '.github/workflows/application.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: application-publishing-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unit:
    name: Release unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/checks.py --only python
  lint:
    name: Release lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/release_images.py lint
  build_scan:
    name: Build and scan (${{ matrix.component }})
    needs: [unit, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [api, worker, analytics]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build once, verify and scan the saved artifact without AWS credentials
        run: >-
          python3 scripts/release_images.py build
          --component '${{ matrix.component }}' --commit '${{ github.sha }}'
          --run '${{ github.run_id }}' --attempt '${{ github.run_attempt }}'
          --directory '${{ runner.temp }}/release-${{ matrix.component }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-${{ matrix.component }}/image.tar
            ${{ runner.temp }}/release-${{ matrix.component }}/trivy.json
            ${{ runner.temp }}/release-${{ matrix.component }}/manifest.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Retain a failed scan report without publishing an image
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-scan-${{ matrix.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-${{ matrix.component }}/trivy.json
          retention-days: 7
          if-no-files-found: ignore
  publish:
    name: Publish (${{ matrix.component }})
    needs: [build_scan, release_artifacts]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ECR_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ecr-publish
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_PUBLISH_ROLE_ARN: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
      ECR_REPOSITORY_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX || 'canopyops-demo' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, worker, analytics]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ matrix.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-${{ matrix.component }}
      - name: Verify artifact before requesting AWS credentials
        run: >-
          python3 scripts/release_images.py verify
          --component '${{ matrix.component }}' --commit '${{ github.sha }}'
          --run '${{ github.run_id }}' --attempt '${{ github.run_attempt }}'
          --directory '${{ runner.temp }}/release-${{ matrix.component }}'
      - name: Validate public publishing configuration before requesting credentials
        run: |
          python3 - <<'PY'
          import os, re
          account = os.environ['AWS_ACCOUNT_ID']
          prefix = os.environ['ECR_REPOSITORY_PREFIX']
          assert re.fullmatch(r'[0-9]{12}', account), 'Set the approved AWS account configuration'
          assert re.fullmatch(r'[a-z0-9]+([._-][a-z0-9]+)*', prefix) and len(prefix) <= 100, 'Unexpected repository namespace'
          assert os.environ['AWS_PUBLISH_ROLE_ARN'] == f'arn:aws:iam::{account}:role/{prefix}-github-publisher', 'Unexpected publishing role configuration'
          PY
      - name: Require the latest successful main CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/wait_for_ci.py --repository '${{ github.repository }}' --commit '${{ github.sha }}'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: eu-west-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 900
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
            {"Effect":"Allow","Action":"ecr:GetAuthorizationToken","Resource":"*"},
            {"Effect":"Allow","Action":["ecr:BatchCheckLayerAvailability","ecr:InitiateLayerUpload","ecr:UploadLayerPart","ecr:CompleteLayerUpload","ecr:PutImage","ecr:BatchGetImage","ecr:DescribeRepositories","ecr:DescribeImageScanFindings"],
            "Resource":"arn:aws:ecr:eu-west-2:${{ vars.AWS_ACCOUNT_ID }}:repository/${{ vars.ECR_REPOSITORY_PREFIX || 'canopyops-demo' }}/${{ matrix.component }}"}]}
      - name: Publish the saved image and verify its ECR configuration digest
        run: >-
          python3 scripts/release_images.py publish
          --component '${{ matrix.component }}' --commit '${{ github.sha }}'
          --run '${{ github.run_id }}' --attempt '${{ github.run_attempt }}'
          --directory '${{ runner.temp }}/release-${{ matrix.component }}'
          --account "$AWS_ACCOUNT_ID"
          --prefix "$ECR_REPOSITORY_PREFIX"
          --receipt '${{ runner.temp }}/published/${{ matrix.component }}.json'
      - name: Retain native ECR report on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-ecr-${{ matrix.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/published/${{ matrix.component }}.native-scan.json
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-${{ matrix.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/published/${{ matrix.component }}.json
          retention-days: 7
          if-no-files-found: error
  catalogue:
    name: Record complete immutable release
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: published-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/published
          merge-multiple: true
      - name: Require all three receipts before recording a release
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          folder = Path('${{ runner.temp }}/published')
          records = [json.loads(path.read_text()) for path in folder.glob('*.json')]
          assert len(records) == 3
          assert {r['component'] for r in records} == {'api', 'worker', 'analytics'}
          assert all(r['commit'] == '${{ github.sha }}' for r in records)
          assert all(r['native_scan']['status'] == 'COMPLETE' for r in records)
          assert all(not r['native_scan']['counts'].get(s, 0) for r in records for s in ['HIGH', 'CRITICAL'])
          Path('${{ runner.temp }}/release-manifest.json').write_text(json.dumps(records, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: immutable-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-manifest.json
          retention-days: 7
          if-no-files-found: error
  release_artifacts:
    name: release-artifacts
    if: ${{ always() }}
    needs: [unit, lint, build_scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all release validation jobs
        run: |
          test '${{ needs.unit.result }}' = success
          test '${{ needs.lint.result }}' = success
          test '${{ needs.build_scan.result }}' = success
