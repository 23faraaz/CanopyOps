name: Terraform deploy
on:
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: Successful Terraform plan workflow run ID for current main (expires after two hours)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'terraform-demo-state' || format('terraform-unprivileged-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/terraform-static.yml
    with:
      roots: '["infra"]'
  review:
    needs: checks
    if: github.ref == 'refs/heads/main' && vars.TERRAFORM_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      PLAN_RUN_ID: ${{ inputs.plan_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the validated plan review before environment approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/terraform_automation.py preflight --operation deploy
          --commit '${{ github.sha }}' --run '${{ github.run_id }}' --attempt '${{ github.run_attempt }}'
          --account "$AWS_ACCOUNT_ID" --role "arn:aws:iam::${AWS_ACCOUNT_ID}:role/canopyops-demo-terraform-deploy"
          --directory '${{ runner.temp }}/terraform-review' --plan-run "$PLAN_RUN_ID"
  deploy:
    needs: review
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.TERRAFORM_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: terraform-deploy
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_TF_ROLE_ARN: ${{ vars.AWS_TF_ROLE_ARN }}
      PLAN_RUN_ID: ${{ inputs.plan_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source and selected plan before requesting AWS credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/terraform_automation.py preflight
          --operation deploy --commit '${{ github.sha }}'
          --run '${{ github.run_id }}' --attempt '${{ github.run_attempt }}'
          --account "$AWS_ACCOUNT_ID" --role "$AWS_TF_ROLE_ARN"
          --directory '${{ runner.temp }}/terraform-demo' --plan-run "$PLAN_RUN_ID"
      - name: Require successful main CI for the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/wait_for_ci.py --repository 23faraaz/CanopyOps --commit '${{ github.sha }}'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TF_ROLE_ARN }}
          aws-region: eu-west-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 3600
          unset-current-credentials: true
      - name: Execute the bounded demo operation
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/terraform_automation.py execute
          --operation deploy --commit '${{ github.sha }}'
          --run '${{ github.run_id }}' --attempt '${{ github.run_attempt }}'
          --account "$AWS_ACCOUNT_ID" --role "$AWS_TF_ROLE_ARN"
          --directory '${{ runner.temp }}/terraform-demo' --plan-run "$PLAN_RUN_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-demo-deploy-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/terraform-demo/receipt/receipt.json
          retention-days: 7
          if-no-files-found: error
