# Merge with compose.yaml. Existing SQLite volume stays mounted and intact.
services:
  postgres:
    image: postgres:17.12-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536
    environment:
      POSTGRES_DB: canopy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_admin
    secrets: [pg_admin, pg_migrator, pg_reader, pg_writer]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d canopy"]
      interval: 3s
      timeout: 3s
      retries: 30
    # No database port is published to the laptop.
    shm_size: 128mb
    stop_grace_period: 30s

  api:
    environment:
      BACKEND: postgres
      PGHOST: postgres
      PGDATABASE: canopy
      PGUSER: canopy_reader
      PGPASSWORD_FILE: /run/secrets/pg_reader
    secrets: [pg_reader]
    depends_on:
      postgres:
        condition: service_healthy

  generator:
    network_mode: !reset null
    environment:
      BACKEND: postgres
      PGHOST: postgres
      PGDATABASE: canopy
      PGUSER: canopy_writer
      PGPASSWORD_FILE: /run/secrets/pg_writer
    secrets: [pg_writer]

  migration:
    image: canopyops:local
    profiles: [tools]
    command: ["python", "-m", "canopy.migrate"]
    environment:
      PGHOST: postgres
      PGDATABASE: canopy
      PGUSER: canopy_migrator
      PGPASSWORD_FILE: /run/secrets/pg_migrator
    secrets: [pg_migrator, pg_reader, pg_writer]
    volumes:
      - canopyops-data:/sqlite
      - ./backups:/backups
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      disable: true

secrets:
  pg_admin:
    file: ./.secrets/pg_admin
  pg_migrator:
    file: ./.secrets/pg_migrator
  pg_reader:
    file: ./.secrets/pg_reader
  pg_writer:
    file: ./.secrets/pg_writer

volumes:
  postgres-data:
