services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: canopyops:local
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    expose:
      - "9100"
    environment:
      BACKEND: local
      DATABASE_PATH: /data/canopy.db
      HOST: 0.0.0.0
      PORT: "8000"
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: "9100"
    volumes:
      - canopyops-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  canopyops-data:
