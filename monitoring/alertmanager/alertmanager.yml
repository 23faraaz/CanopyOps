global:
  resolve_timeout: 30s
route:
  receiver: local-durable-webhook
  group_by: [alertname]
  group_wait: 2s
  group_interval: 5s
  repeat_interval: 30m
receivers:
  - name: local-durable-webhook
    webhook_configs:
      - url: http://alert-receiver:9080/alerts
        send_resolved: true
        max_alerts: 20
        timeout: 5s
