name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    name: Application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python syntax, Ruff lint and format, pytest
        run: python3 scripts/checks.py --only python
      - name: Hadolint, actionlint, quiet Compose validation
        run: python3 scripts/checks.py --only configuration
      - name: Build, cache, health, storage and runtime exclusions
        run: python3 scripts/checks.py --only container
      - name: Strict HIGH and CRITICAL vulnerability gate
        run: python3 scripts/checks.py --only scan
      - name: Verify scan workspace cleanup
        if: always()
        run: |
          python3 - <<'PY'
          import tempfile
          from pathlib import Path
          remaining = list(Path(tempfile.gettempdir()).glob("canopy-image-scan-*"))
          assert not remaining, "Scan temporary directories remain"
          print("Scan workspace cleanup verified")
          PY
  terraform:
    uses: ./.github/workflows/terraform-static.yml
  modules:
    name: Application Terraform module contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Module formatting, mock tests, lint and strict security checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/module_checks.py --ci-plugin-token
  workflow-security:
    name: Workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline workflow security gate and negative controls
        run: python3 scripts/workflow_security.py --self-test
  checks:
    name: checks
    if: ${{ always() }}
    needs: [application, terraform, modules, workflow-security]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require application and every Terraform matrix job
        run: |
          test '${{ needs.application.result }}' = success
          test '${{ needs.terraform.result }}' = success
          test '${{ needs.modules.result }}' = success
          test '${{ needs.workflow-security.result }}' = success
